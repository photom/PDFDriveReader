name: Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "**" ]

# `shell: bash` runs steps with `-eo pipefail`, so `gradlew ... | tee` fails
# when Gradle fails (the implicit default shell has no pipefail).
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      # setup-gradle caches each job's own dependencies. setup-java's shared
      # `cache: gradle` key let whichever job finished first save the cache,
      # so test-only artifacts were re-downloaded and Maven Central
      # intermittently answered 429 Too Many Requests.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      # Robolectric downloads its Android runtime jars into ~/.m2 at test time.
      # Key on the Robolectric version only, so other dependency bumps reuse it.
      - name: Read Robolectric version
        id: robolectric
        run: echo "version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache Robolectric runtime
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}
      - name: Test CI scripts
        run: python3 -m unittest discover -s .github/scripts
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee gradle-test.log
      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon 2>&1 | tee gradle-lint.log
      - name: Report Gradle failures
        if: failure()
        run: python3 .github/scripts/report_gradle_failures.py gradle-test.log gradle-lint.log
      - name: TEMP dependency diagnostics
        if: always()
        run: |
          ./gradlew -q buildEnvironment :app:dependencies --no-daemon > deps.txt 2>&1 || true
          python3 - <<'PY'
          import re, collections
          pats = {"netty": r"io\.netty:", "guava": r"com\.google\.guava:guava:", "bouncycastle": r"org\.bouncycastle:", "kgp": r"org\.jetbrains\.kotlin:kotlin-gradle-plugin[:-]"}
          hits = {k: collections.defaultdict(set) for k in pats}
          conf = "?"
          for line in open("deps.txt", errors="replace"):
              line = line.rstrip()
              m = re.match(r"^([A-Za-z][\w]*)( - .*)?$", line)
              if m and not line.startswith(("+", "|", "\\")):
                  conf = m.group(1)
                  continue
              for k, p in pats.items():
                  if re.search(p, line):
                      dep = re.sub(r"^[\s|+\\-]+", "", line).replace(" (*)", "").replace(" (c)", "")
                      hits[k][dep].add(conf)
          for k, deps in hits.items():
              msg = "\n".join(f"{d}  <- {','.join(sorted(c))[:300]}" for d, c in sorted(deps.items())) or "none"
              print(f"::notice title=deps {k}::" + msg[:3800].replace("%", "%25").replace("\n", "%0A"))
          PY
          grep -nE "[Pp]roject '|^[a-zA-Z][A-Za-z0-9]*( - .*)?\$|io\.netty:netty-codec-http:" deps.txt | grep -B4 'netty-codec-http:' | head -60 || true
      - name: Upload Lint Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle-build.log
      - name: Report Gradle failures
        if: failure()
        run: python3 .github/scripts/report_gradle_failures.py gradle-build.log
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5

  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v6
